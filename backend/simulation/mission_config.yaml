mission_name: "STELLAR Deep Space Explorer"
simulation_mode: true
safety_notice: "SIMULATION-ONLY ENVIRONMENT — NOT CONNECTED TO ANY LIVE SPACECRAFT"

spacecraft:
  name: "STELLAR-1"
  initial_state:
    battery_soc: 95.0
    battery_temp: 20.0
    bus_voltage: 28.0
    storage_used_gb: 10.0
    solar_generation_w: 150.0
    antenna_visible: true
    pointing_mode: "SUN_POINTING"

communication_windows:
  - start_offset_s: 0
    duration_s: 600
    ground_station: "DSN-Goldstone"
  - start_offset_s: 900
    duration_s: 600
    ground_station: "DSN-Madrid"

demo_scenario:
  auto_fault_injection:
    fault_type: "battery_thermal_runaway"
    trigger_at_mission_time: 180
    description: "Inject battery thermal excursion at T+180s for demo."

telemetry:
  generation_interval_s: 1
  thresholds:
    battery_soc:
      warning_low: 30.0
      critical_low: 15.0
    battery_temp:
      warning_high: 35.0
      critical_high: 45.0
    bus_voltage:
      warning_low: 25.0
      critical_low: 23.0
    storage_used_gb:
      warning_high: 14.0
      critical_high: 15.5
